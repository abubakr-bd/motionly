<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-small.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>Motionly Media | High-Retention Video Marketing & Editing Agency</title>
    <meta name="title" content="Motionly Media | High-Retention Video Marketing & Editing Agency" />
    <meta name="description" content="Scale your brand with high-retention video editing, VSL production, and content marketing. Explore Motionly Media's work and services." />
    <meta name="keywords" content="video marketing agency, high-retention editing, VSL strategy, content creation, YouTube growth, shorts editing, premium video agency, Motionly Media" />
    <meta name="author" content="Motionly Media" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />      
    <meta property="og:url" content="https://motionly.media/" />
    <meta property="og:title" content="Motionly Media | High-Retention Video Marketing Agency" />
    <meta property="og:description" content="Scale your brand with high-retention video editing, VSL production, and content marketing. Explore Motionly Media's work and services." />
    <meta property="og:image" content="https://motionly.media/og-image-v2.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://motionly.media/" />
    <meta name="twitter:title" content="Motionly Media | High-Retention Video Marketing Agency" />
    <meta name="twitter:description" content="Scale your brand with high-retention video editing, VSL production, and content marketing. Explore Motionly Media's work and services." />
    <meta name="twitter:image" content="https://motionly.media/og-image-v2.png" />

    <!-- Favicon / Theme -->
    <link rel="apple-touch-icon" href="/favicon-small.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#2563eb" />

    <link rel="canonical" href="https://motionly.media/" />

    <!-- Preconnect to external origins for faster asset and API load -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://img.youtube.com" crossorigin />
    <link rel="dns-prefetch" href="https://img.youtube.com" />
    <link rel="preconnect" href="https://motionly-media.firebaseapp.com" crossorigin />
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="dns-prefetch" href="https://www.googleapis.com" />

    <!-- Google Fonts: Outfit (sans) + Playfair Display (display serif) Non-render-blocking -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,700;0,800;1,700;1,800;1,900&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,700;0,800;1,700;1,800;1,900&display=swap" media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,700;0,800;1,700;1,800;1,900&display=swap" />
    </noscript>

    <!-- Preload LCP logo asset -->
    <link rel="preload" as="image" href="/nav_logo.webp" fetchpriority="high" />

    <!-- Structured Data (Organization & WebSite) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://motionly.media/#website",
          "url": "https://motionly.media/",
          "name": "Motionly Media",
          "description": "Elite video systems engineered for high retention and revenue growth.",
          "publisher": {
            "@id": "https://motionly.media/#organization"
          }
        },
        {
          "@type": "Organization",
          "@id": "https://motionly.media/#organization",
          "name": "Motionly Media",
          "url": "https://motionly.media/",
          "logo": {
            "@type": "ImageObject",
            "url": "https://motionly.media/nav_logo.webp"
          },
          "image": "https://motionly.media/nav_logo.webp",
          "sameAs": [
            "https://twitter.com/motionlymedia",
            "https://www.instagram.com/motionlymedia",
            "https://www.linkedin.com/company/motionly-media"
          ],
          "contactPoint": {
            "@type": "ContactPoint",
            "contactType": "customer support",
            "email": "hello@motionly.media"
          }
        },
        {
          "@type": "ProfessionalService",
          "@id": "https://motionly.media/#service",
          "name": "Motionly Media",
          "url": "https://motionly.media/",
          "image": "https://motionly.media/og-image-v2.png",
          "description": "Elite video systems engineered for high retention and revenue growth.",
          "priceRange": "$$$",
          "areaServed": [
            "United States",
            "United Kingdom",
            "Canada",
            "Worldwide"
          ],
          "hasOfferCatalog": {
            "@type": "OfferCatalog",
            "name": "Video Production & Editing Services",
            "itemListElement": [
              {
                "@type": "Offer",
                "itemOffered": {
                  "@type": "Service",
                  "name": "High-Retention Video Editing"
                }
              },
              {
                "@type": "Offer",
                "itemOffered": {
                  "@type": "Service",
                  "name": "YouTube Growth & VSL Production"
                }
              },
              {
                "@type": "Offer",
                "itemOffered": {
                  "@type": "Service",
                  "name": "Personal Branding Video Systems"
                }
              }
            ]
          }
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
